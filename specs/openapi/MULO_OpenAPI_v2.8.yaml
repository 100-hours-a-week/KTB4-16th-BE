openapi: 3.0.3
info:
  title: MULO API
  version: '2.8'
  description: |-
    MULO 통합 API 계약 기준 OpenAPI 문서입니다.

    - 현재 feature 구현과 기존 OpenAPI v2.6 계약을 함께 보존합니다.
    - FRIEND V2는 친구 요청·요청 관리·친구 대시보드와 친구 자물쇠 읽기를 구현합니다.
    - 각 작업의 x-implementation-status는 implemented, contract-only, excluded-v1 중 하나입니다.
    - 홈 인기 자물쇠는 조회 시점 기준 최근 7일 데이터를 사용합니다.
    - 내 자물쇠 조회와 사용자 자물쇠 지역 그룹에는 7일 제한을 적용하지 않습니다.
    - 신규 Place는 서버 Kakao 역지오코딩에서 유효한 법정동(B) code/name을 확인한 경우에만 생성하며, 기존 데이터의 미확인 법정동 조회 fallback은 유지합니다.
    - 커서 기반 목록 API size는 기본 20, 최소 1, 최대 100이며 채팅 메시지 내역만 기본 30입니다.
    - 알림의 목록 조회·일괄 읽음·삭제 API와 친구·월간 리포트 Outbox 처리를 구현했습니다. MATCH_COMPLETED 발행은 모든 환경의 레거시 4인 이력 확인과 Chat DB 참가자 등록 근거가 마련될 때까지 보류합니다.
    - Refresh/CSRF Cookie의 SameSite 최종 정책은 배포 구조에 따라 확정하며 현재 구현은 Strict입니다.
    - 서버 URL은 아직 확정되지 않아 지정하지 않았습니다.
