spring:
  application:
    name: mulo

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mulo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:mulo}
    # 비밀번호 기본값을 두지 않는다. 실행 환경에서 반드시 주입한다.
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

logging:
  level:
    org.flywaydb: info

# 안전한 기본값은 운영 same-origin/HTTPS. HTTP 개발은 local 프로필을 명시한다.
mulo:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT1H
    refresh-token-ttl: P7D
  security:
    allowed-origins: []
    cookie-secure: true

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}

kma:
  base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
  service-key: ${KMA_SERVICE_KEY}
