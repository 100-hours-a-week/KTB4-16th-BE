spring:
  autoconfigure:
    exclude: org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  application:
    name: mulo

  rabbitmq:
    host: ${RABBITMQ_HOST:}
    port: ${RABBITMQ_PORT:0}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:}

  datasource:
    # MySQL이 보고하는 모호한 KST 대신 Connector/J에 명시적 시간대를 전달한다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/mulo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:mulo}
    # 비밀번호 기본값을 두지 않는다. 실행 환경에서 반드시 주입한다.
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 부하 테스트에서 풀 10개와 처리량 차이가 작아 초기값 3개를 사용한다.
      maximum-pool-size: 3
      # 커넥션 획득 대기 상한이다. SQL 실행시간이나 API 전체 타임아웃은 제한하지 않는다.
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      # photo 한 장과 multipart boundary/header overhead를 허용한다.
      max-request-size: 11MB

# Tomcat의 연결·스레드 지표를 Micrometer가 수집할 수 있도록 MBean 레지스트리를 켠다.
server:
  tomcat:
    mbeanregistry:
      enabled: true

memory-search:
  # 비운영·테스트의 기본값이다. prod 프로필은 Redis를 선택하고 필수 설정을 시작 시 검증한다.
  conversation-store: ${MEMORY_SEARCH_CONVERSATION_STORE:in-memory}
  conversation-environment: ${MEMORY_SEARCH_CONVERSATION_ENVIRONMENT:local}
  # 마지막으로 완료된 질문 뒤 대화 문맥을 보존하는 유휴 시간이다.
  conversation-idle-ttl: 30m
  # 문맥 TTL과 별개인 고정 점유 기한의 초기 검증값이다. 만료 응답은 문맥에 반영하지 않는다.
  request-lock-ttl: ${MEMORY_SEARCH_REQUEST_LOCK_TTL:60s}

# 상태, Prometheus, 애플리케이션 정보와 지표 엔드포인트를 HTTP에 등록한다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false
  max-request-body-size: none

gcs:
  project-id: ${GCP_PROJECT_ID}
  bucket-name: ${GCS_BUCKET_NAME}

upload:
  heic:
    max-pixels: ${HEIC_MAX_PIXELS:25000000}
    process-timeout: ${HEIC_PROCESS_TIMEOUT:PT15S}
    max-concurrent-conversions: ${HEIC_MAX_CONCURRENT_CONVERSIONS:2}
    permit-timeout: ${HEIC_PERMIT_TIMEOUT:PT1S}
    heif-convert-command: ${HEIF_CONVERT_COMMAND:heif-convert}
    jpegtran-command: ${JPEGTRAN_COMMAND:jpegtran}

logging:
  level:
    org.flywaydb: info

# 안전한 기본값은 운영 same-origin/HTTPS. HTTP 개발은 local 프로필을 명시한다.
mulo:
  daily-song:
    scheduler:
      enabled: ${MULO_DAILY_SONG_SCHEDULER_ENABLED:false}
  rabbitmq:
    enabled: ${MULO_RABBITMQ_ENABLED:false}
  # Redis를 사용하는 기능들이 공유하는 접속 정보다. 연결은 최초 사용 시에만 연다.
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:16382}
    connect-timeout: 300ms
    # TCP 연결·일반 명령과 분리한 HELLO 등 최초 연결 준비의 유한 기한이다.
    initialization-timeout: ${REDIS_INITIALIZATION_TIMEOUT:5s}
    command-timeout: 100ms
  # 별도 프로필 없이 활성화 값으로 인기곡 캐시를 선택한다. 기본 실행은 off다.
  popular-cache:
    enabled: ${MULO_POPULAR_CACHE_ENABLED:false}
    namespace: ${MULO_POPULAR_CACHE_NAMESPACE:mulo:popular-cache-local}
    ttl: ${MULO_POPULAR_CACHE_TTL:30s}
    lock-ttl: 10s
    wait-timeout: 500ms
    retry-backoff: 1s
  music-search-rate-limit:
    namespace: ${MULO_MUSIC_SEARCH_RATE_LIMIT_NAMESPACE}
  ai-db:
    enabled: ${MULO_AI_DB_ENABLED:false}
    url: ${MULO_AI_DB_URL:}
    username: ${MULO_AI_DB_USERNAME:}
    password: ${MULO_AI_DB_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT1H
    refresh-token-ttl: P7D
  security:
    allowed-origins:
      - https://mulostudio.com
    cookie-secure: true

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}

kma:
  base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
  service-key: ${KMA_SERVICE_KEY}

spotify:
  client-id: ${SPOTIFY_CLIENT_ID}
  client-secret: ${SPOTIFY_CLIENT_SECRET}
  accounts-base-url: https://accounts.spotify.com
  api-base-url: https://api.spotify.com
  connect-timeout: PT2S
  read-timeout: PT3S
  user-limit-30-seconds: 8
  user-limit-60-seconds: 15
  global-limit-30-seconds: 80

ai:
  # 실행 환경의 AI 주소·토큰을 사용한다. 토큰 값은 소스에 기록하지 않는다.
  base-url: ${AI_BASE_URL:http://localhost:8000}
  internal-token: ${AI_INTERNAL_TOKEN}
  connect-timeout: PT5S
  read-timeout: PT30S
  mock-enabled: ${AI_MOCK_ENABLED:false}

chat-server:
  base-url: ${CHAT_SERVER_BASE_URL:http://localhost:8090}
  internal-api-key: ${CHAT_INTERNAL_API_KEY:}
  connect-timeout: ${CHAT_SERVER_CONNECT_TIMEOUT:PT2S}
  read-timeout: ${CHAT_SERVER_READ_TIMEOUT:PT3S}

chat-auth:
  verify-api-key: ${CHAT_AUTH_VERIFY_API_KEY:}
