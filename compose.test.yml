name: mulo-general-test

services:
  mysql:
    image: mysql:8.4
    container_name: mulo-general-test-mysql
    environment:
      MYSQL_DATABASE: mulo_test
      MYSQL_USER: mulo_test
      MYSQL_PASSWORD: mulo_test_only_password
      MYSQL_ROOT_PASSWORD: mulo_test_root_only_password
    ports:
      - "127.0.0.1:3313:3306"
    volumes:
      - general-test-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  general-test-data:
    name: mulo-general-test-data
