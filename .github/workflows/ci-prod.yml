name: Backend CI prod

# main 브랜치 전용 CI. PR 검증, push 시 프로덕션 이미지 릴리즈까지만 한다.
# 프로덕션 배포는 cd-prod.yml이 이 워크플로가 성공하면 이어서 한다.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - main

jobs:
  pr-ci:
    if: github.event_name == 'pull_request'
    name: Backend CI prod pull_request
    runs-on: ubuntu-latest
    concurrency:
      group: pr-ci-${{ github.ref }}
      cancel-in-progress: true
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mulo
          MYSQL_USER: mulo
          MYSQL_PASSWORD: mulo
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      # PR 게이트웨이 검사 유지
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      # 컴파일 (테스트 코드 포함)
      - name: Run Compile
        run: ./gradlew compileJava compileTestJava

      # 테스트가 실제 MySQL을 쓴다. weather-it 테스트는 127.0.0.1:3307의 mulo_weather_it DB만 허용한다.
      - name: Prepare test database
        run: |
          mysql -h127.0.0.1 -P3307 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS mulo_weather_it CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE DATABASE IF NOT EXISTS mulo_friend_deadlock_it CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL ON mulo_weather_it.* TO 'mulo'@'%'; GRANT ALL ON mulo_friend_deadlock_it.* TO 'mulo'@'%'; FLUSH PRIVILEGES;"

      # 관리자 권한이 필요한 잠금·migration 회귀 5개는 일반 test와 분리해 먼저 실행한다.
      - name: Run Dedicated Database Regressions
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3307/mulo_friend_deadlock_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          DB_USERNAME: mulo
          DB_PASSWORD: mulo
          MULO_DEADLOCK_IT_ADMIN_URL: jdbc:mysql://127.0.0.1:3307/mulo_friend_deadlock_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          MULO_DEADLOCK_IT_ADMIN_USERNAME: root
          MULO_DEADLOCK_IT_ADMIN_PASSWORD: root
          MULO_NOTIFICATION_IT_DB_URL: jdbc:mysql://127.0.0.1:3307/
          MULO_NOTIFICATION_IT_DB_USERNAME: root
          MULO_NOTIFICATION_IT_DB_PASSWORD: root
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          GCP_PROJECT_ID: mulo-ci-test
          GCS_BUCKET_NAME: mulo-ci-test
          KAKAO_REST_API_KEY: ci-test
          KMA_SERVICE_KEY: ci-test
          SPOTIFY_CLIENT_ID: ci-test
          SPOTIFY_CLIENT_SECRET: ci-test
          AI_INTERNAL_TOKEN: ci-test-token
          JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
        run: ./gradlew friendDeadlockTest notificationMigrationTest --rerun-tasks

      # 테스트 실행 + 커버리지 검사 (60% 미만이면 여기서 실패)
      - name: Run Tests and Coverage Verification
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3307/mulo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          DB_USERNAME: mulo
          DB_PASSWORD: mulo
          MULO_WEATHER_IT_DB_URL: jdbc:mysql://127.0.0.1:3307/mulo_weather_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          MULO_WEATHER_IT_DB_USERNAME: mulo
          MULO_WEATHER_IT_DB_PASSWORD: mulo
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          GCP_PROJECT_ID: mulo-ci-test
          GCS_BUCKET_NAME: mulo-ci-test
          KAKAO_REST_API_KEY: ci-test
          KMA_SERVICE_KEY: ci-test
          SPOTIFY_CLIENT_ID: ci-test
          SPOTIFY_CLIENT_SECRET: ci-test
          AI_INTERNAL_TOKEN: ci-test-token
          # 앱 JVM은 운영과 같은 Asia/Seoul로 돌린다. 러너 기본 시간대(UTC)면 시간 기준 테스트가 실패한다.
          JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --rerun-tasks

      # 리포트는 실패했을 때도 확인할 수 있도록 항상 올린다
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          retention-days: 7

      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
          retention-days: 7

      - name: Notify result
        if: ${{ always() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Backend CI prod pull_request"
          status: ${{ job.status }}

  main-ci:
    if: github.event_name == 'push'
    name: Backend CI prod release
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mulo
          MYSQL_USER: mulo
          MYSQL_PASSWORD: mulo
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    concurrency:
      group: backend-main-release
      cancel-in-progress: false

    permissions:
      contents: write      # Git 태그, Release 생성
      id-token: write      # GCP Workload Identity와 통신하기 위한 OIDC 토큰 발행 권한

    env:
      IMAGE_BASE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_REPOSITORY }}/${{ secrets.IMAGE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      # 테스트가 실제 MySQL을 쓴다. weather-it 테스트는 127.0.0.1:3307의 mulo_weather_it DB만 허용한다.
      - name: Prepare test database
        run: |
          mysql -h127.0.0.1 -P3307 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS mulo_weather_it CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE DATABASE IF NOT EXISTS mulo_friend_deadlock_it CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; GRANT ALL ON mulo_weather_it.* TO 'mulo'@'%'; GRANT ALL ON mulo_friend_deadlock_it.* TO 'mulo'@'%'; FLUSH PRIVILEGES;"

      # 관리자 권한이 필요한 잠금·migration 회귀 5개는 일반 test와 분리해 먼저 실행한다.
      - name: Run Dedicated Database Regressions
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3307/mulo_friend_deadlock_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          DB_USERNAME: mulo
          DB_PASSWORD: mulo
          MULO_DEADLOCK_IT_ADMIN_URL: jdbc:mysql://127.0.0.1:3307/mulo_friend_deadlock_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          MULO_DEADLOCK_IT_ADMIN_USERNAME: root
          MULO_DEADLOCK_IT_ADMIN_PASSWORD: root
          MULO_NOTIFICATION_IT_DB_URL: jdbc:mysql://127.0.0.1:3307/
          MULO_NOTIFICATION_IT_DB_USERNAME: root
          MULO_NOTIFICATION_IT_DB_PASSWORD: root
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          GCP_PROJECT_ID: mulo-ci-test
          GCS_BUCKET_NAME: mulo-ci-test
          KAKAO_REST_API_KEY: ci-test
          KMA_SERVICE_KEY: ci-test
          SPOTIFY_CLIENT_ID: ci-test
          SPOTIFY_CLIENT_SECRET: ci-test
          AI_INTERNAL_TOKEN: ci-test-token
          JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
        run: ./gradlew friendDeadlockTest notificationMigrationTest --rerun-tasks

      # 테스트 실행 + 커버리지 검사 (60% 미만이면 여기서 실패)
      - name: Run Tests and Coverage Verification
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3307/mulo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          DB_USERNAME: mulo
          DB_PASSWORD: mulo
          MULO_WEATHER_IT_DB_URL: jdbc:mysql://127.0.0.1:3307/mulo_weather_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
          MULO_WEATHER_IT_DB_USERNAME: mulo
          MULO_WEATHER_IT_DB_PASSWORD: mulo
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          GCP_PROJECT_ID: mulo-ci-test
          GCS_BUCKET_NAME: mulo-ci-test
          KAKAO_REST_API_KEY: ci-test
          KMA_SERVICE_KEY: ci-test
          SPOTIFY_CLIENT_ID: ci-test
          SPOTIFY_CLIENT_SECRET: ci-test
          AI_INTERNAL_TOKEN: ci-test-token
          # 앱 JVM은 운영과 같은 Asia/Seoul로 돌린다. 러너 기본 시간대(UTC)면 시간 기준 테스트가 실패한다.
          JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --rerun-tasks

      # 리포트는 실패했을 때도 확인할 수 있도록 항상 올린다
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          retention-days: 7

      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
          retention-days: 7

      # 테스트는 위에서 이미 실행했으므로 jar는 테스트를 건너뛰고 만든다
      - name: Build jar
        run: ./gradlew bootJar -x test

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      # release.config.main.json을 이 job 안에서만 .releaserc.json으로 복사해서 쓴다.
      # `semantic-release --extends <path>`로 직접 넘기면 플러그인 모듈 해석 기준 경로가
      # 달라져서 semantic-release 코어에 번들된 기본 플러그인(commit-analyzer 등)조차
      # 못 찾는 문제가 있었다(2026-09-30 실제 발생, main-ci에서 재현 확인). cosmiconfig가
      # 원래 쓰던 자동 탐색 방식 그대로 두고, 파일만 이 job 시작 시점에 맞바꿔 충돌을 피한다.
      - name: Release backend image
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          cp release.config.main.json .releaserc.json
          npx --yes \
            --package=semantic-release@25 \
            --package=@semantic-release/exec@7 \
            semantic-release

      - name: Notify result
        if: ${{ always() }}
        uses: ./.github/actions/notify-discord
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Backend CI prod release"
          status: ${{ job.status }}
