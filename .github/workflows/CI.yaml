name : develop CI with backend

on:
  pull_request:
    branches:
      - develop

# 버전 작업 동시에 실행되지 않게 
concurrency:
  group: backend-main-release
  cancel-in-progress: false

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest

    # 워크플로우 권한 정의
    permissions:
      contents: write      # Git 태그, Release 생성
      id-token: write      # GCP Workload Identity와 통신하기 위한 OIDC 토큰 발행 권한
      
    env:
      IMAGE_BASE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_REPOSITORY }}/${{ secrets.IMAGE_NAME }}
      
    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v7
        with:
            fetch-depth: 0
        
      # 2. JDK 환경 설정 (캐싱 포함)
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          
      # 3. Gradle 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
          
      # 4. Gradle 실행 권한 부여
      - name: Grant execute permission
        run: chmod +x gradlew
        

      # Phase 1: Lint (Checkstyle)
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain
        

      # Phase 2: Compile 및 JAR 생성
      - name: Run Compile 
        run: ./gradlew bootJar

  notify:
      name: Discord notification
      runs-on: ubuntu-latest
      needs: ci

      # CI가 실패해도 알림 작업 실행
      if: ${{ always() }}
      permissions: {}

      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      steps:
        - name: Send CI result to Discord
          if: ${{ env.DISCORD_WEBHOOK != '' }}
          uses: Ilshidur/action-discord@0.3.2
          with:
            args: "백엔드 CI 결과 알림"
          env:
            DISCORD_USERNAME: MURO_BOT
            DISCORD_EMBEDS: |
              [
                {
                  "title": "Backend CI: ${{ needs.ci.result }}",
                  "description": ${{ toJSON(github.event.pull_request.title) }},
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "color": ${{ needs.ci.result == 'success' && 3066993 || 15158332 }},
                  "fields": [
                    {
                      "name": "PR",
                      "value": "[#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})",
                      "inline": true
                    },
                    {
                      "name": "작성자",
                      "value": ${{ toJSON(github.event.pull_request.user.login) }},
                      "inline": true
                    },
                    {
                      "name": "작업 브랜치",
                      "value": ${{ toJSON(github.head_ref) }},
                      "inline": true
                    },
                    {
                      "name": "대상 브랜치",
                      "value": ${{ toJSON(github.base_ref) }},
                      "inline": true
                    }
                  ]
                }
              ]


