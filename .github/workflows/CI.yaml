name : develop PR CI with backend

on:
  pull_request:
    branches:
      - develop
      

jobs:
  ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v7
        
      # 2. JDK 환경 설정 (캐싱 포함)
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
          
      # 3. Gradle 실행 권한 부여
      - name: Grant execute permission
        run: chmod +x gradlew
        
      # 4.Gradle 빌드 캐시
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Phase 1: Lint (Checkstyle)
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      # Phase 2: Compile
      - name: Run Compile 
        run: ./gradlew compileJava

    
