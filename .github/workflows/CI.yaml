name: develop CI with backend

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: backend-main-release
  cancel-in-progress: false

jobs:
  pr-ci:
    if: github.event_name == 'pull_request'
    name: Backend CI pull_request
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      # PR 게이트웨이 검사 유지
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      # 컴파일 에러 및 기본 테스트 검증
      - name: Run Compile
        run: ./gradlew bootJar


  notify:
    name: Discord notification
    runs-on: ubuntu-latest
    needs: pr-ci
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions: {}

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Send CI result to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "백엔드 Develop pull_request CI 결과 알림"
        env:
          DISCORD_USERNAME: MURO_BOT
          DISCORD_EMBEDS: |
            [
              {
                "title": "Backend CI: ${{ needs.pr-ci.result }}",
                "description": ${{ toJSON(github.event.pull_request.title) }},
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "color": ${{ needs.pr-ci.result == 'success' && 3066993 || 15158332 }},
                "fields": [
                  {
                    "name": "PR",
                    "value": "[#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})",
                    "inline": true
                  },
                  {
                    "name": "작성자",
                    "value": ${{ toJSON(github.event.pull_request.user.login) }},
                    "inline": true
                  },
                  {
                    "name": "작업 브랜치",
                    "value": ${{ toJSON(github.head_ref) }},
                    "inline": true
                  },
                  {
                    "name": "대상 브랜치",
                    "value": ${{ toJSON(github.base_ref) }},
                    "inline": true
                  }
                ]
              }
            ]


  push-ci:
    if: github.event_name == 'push'
    name: Backend CI push
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    env:
      IMAGE_BASE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_Develop }}/${{ secrets.PROJECT_REPOSITORY }}/${{ secrets.IMAGE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # semantic-release가 Git 태그 및 히스토리를 분석해야 하므로 0 유지 필수
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Compile
        run: ./gradlew bootJar

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID_Develop }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER_Develop }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_Develop }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Release backend image
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          npx --yes \
            --package=semantic-release@25 \
            --package=@semantic-release/exec@7 \
            semantic-release


  notify-2:
    name: Discord notification
    runs-on: ubuntu-latest
    needs: push-ci
    if: ${{ always() && github.event_name == 'push' }}
    permissions: {}

    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - name: Send CI result to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "백엔드 Develop push CI 결과 알림"
        env:
          DISCORD_USERNAME: MURO_BOT
          DISCORD_EMBEDS: |
            [
              {
                "title": "Backend CI: ${{ needs.push-ci.result }}",
                "description": ${{ toJSON(github.event.head_commit.message || '커밋 메시지 없음') }},
                "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "color": ${{ needs.push-ci.result == 'success' && 3066993 || 15158332 }},
                "fields": [
                  {
                    "name": "커밋",
                    "value": "[커밋 확인](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})",
                    "inline": true
                  },
                  {
                    "name": "푸시한 사람",
                    "value": ${{ toJSON(github.actor) }},
                    "inline": true
                  },
                  {
                    "name": "브랜치",
                    "value": ${{ toJSON(github.ref_name) }},
                    "inline": true
                  }
                ]
              }
            ]
