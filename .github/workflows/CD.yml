name: Backend CD

# CI(main CI with backend)가 성공적으로 끝나면 자동으로 실행된다.
# workflow_dispatch는 CI 없이 재배포만 다시 시도하고 싶을 때 수동으로 쓰기 위한 것.
on:
  workflow_run:
    workflows: ["main CI with backend"]
    types: [completed]
  workflow_dispatch:

env:
  ZONE: asia-northeast3-a

jobs:
  # ============================================================
  # 1단계 job: Standby VM에 새 버전 배포 + 스모크 테스트까지 전부 자동 실행.
  # 여기서 실패하면(스모크 테스트 실패 포함) switch-traffic job은 아예 시작되지 않고,
  # 승인 요청도 뜨지 않는다.
  # ============================================================
  deploy-and-verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # GCP WIF 인증용 OIDC 토큰 발급 권한
    outputs:
      standby_vm: ${{ steps.standby.outputs.vm }}   # switch-traffic job에서도 이 값을 써야 함
    steps:
      # WIF로 GCP 서비스 계정 인증 (키 파일 없이 임시 토큰 발급)
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 1. 현재 role=standby 라벨이 붙은 VM을 찾는다.
      #    배포는 항상 Standby(트래픽 안 받는 쪽)에만 한다. Active는 여기서 절대 안 건드린다.
      - id: standby
        run: |
          VM=$(gcloud compute instances list \
            --filter="labels.role=standby" \
            --zones="${{ env.ZONE }}" \
            --format="value(name)")
          echo "vm=$VM" >> "$GITHUB_OUTPUT"

      # 2. CI(semantic-release)가 방금 push한 이미지 중 가장 최근 태그를 조회한다.
      #    CD는 이미지를 직접 빌드하지 않고, CI가 이미 push해둔 걸 그대로 가져다 쓴다.
      - id: image
        run: |
          TAG=$(gcloud artifacts docker images list \
            "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_REPOSITORY }}/${{ secrets.IMAGE_NAME }}" \
            --include-tags --sort-by="~UPDATE_TIME" --limit=1 \
            --format="value(TAGS)" | cut -d',' -f1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 3. backend.env 파일을 GitHub Secrets 값으로 생성한다.
      #    이 파일은 여기서만 잠깐 만들어지고, 실제 값은 워크플로 로그에 자동으로 마스킹된다.
      - run: |
          cat > backend.env <<ENVEOF
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          KMA_SERVICE_KEY=${{ secrets.KMA_SERVICE_KEY }}
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}
          ENVEOF

      # 4. env 파일을 Standby VM으로 전송하고, 새 이미지를 pull해서 backend 컨테이너만 교체한다.
      #    같은 VM 위의 frontend/ai/nginx 컨테이너는 건드리지 않는다.
      - run: |
          gcloud compute scp backend.env "${{ steps.standby.outputs.vm }}:~/app/backend.env" \
            --zone="${{ env.ZONE }}" --tunnel-through-iap

          gcloud compute ssh "${{ steps.standby.outputs.vm }}" --zone="${{ env.ZONE }}" --tunnel-through-iap --command="
            cd ~/app &&
            export IMAGE_TAG=${{ steps.image.outputs.tag }} &&
            docker compose pull backend &&
            docker compose up -d backend
          "

      # 5. 스모크 테스트 (지금은 placeholder — 백엔드 API 완성되면 실제 핵심 기능 검증으로 교체 예정)
      #    지금은 컨테이너가 응답만 하는지 확인한다 (Health Check 수준).
      #    이 스텝이 실패하면 job 전체가 실패 처리되고, switch-traffic job은 자동 스킵된다.
      - name: "Smoke Test (TODO: 백엔드 API 완성되면 실제 검증 로직으로 교체)"
        run: |
          gcloud compute ssh "${{ steps.standby.outputs.vm }}" --zone="${{ env.ZONE }}" --tunnel-through-iap --command="
            curl -fsS http://localhost:8080/actuator/health
          "
          # TODO: 실제 핵심 기능 검증 예시
          # curl -fsS -X POST http://localhost:8080/api/locks -H 'Content-Type: application/json' -d '{...}'
          # curl -fsS http://localhost:8080/api/map/locks?lat=...&lng=...

  # ============================================================
  # 2단계 job: 실제 트래픽 전환 (Blue-Green Switch).
  # environment: production 이 붙어있어서, GitHub Settings에서 지정한 승인자가
  # Actions 탭에서 "Approve and deploy"를 눌러야만 이 job이 실행된다.
  # deploy-and-verify가 실패하면 이 job은 아예 시작되지 않고 승인 요청도 안 뜬다.
  # ============================================================
  switch-traffic:
    needs: deploy-and-verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 6. 현재 role=active인 VM(지금까지 트래픽을 받던 VM)을 찾는다.
      # 7. 고정 IP를 Active VM에서 떼어내고 검증이 끝난 Standby VM에 붙인다.
      #    이 순간부터 실제 사용자 트래픽이 새 버전으로 넘어간다.
      # 8. 라벨을 서로 바꾼다 — 방금 전환된 VM이 새 active, 기존 active는 새 standby가 되어
      #    다음 배포 때 그쪽이 배포 대상이 된다.
      - run: |
          ACTIVE_VM=$(gcloud compute instances list \
            --filter="labels.role=active" \
            --zones="${{ env.ZONE }}" \
            --format="value(name)")
          STANDBY_VM="${{ needs.deploy-and-verify.outputs.standby_vm }}"

          gcloud compute instances delete-access-config "$ACTIVE_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT"

          gcloud compute instances add-access-config "$STANDBY_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT" \
            --address="${{ secrets.MURO_PROD_IP }}"

          gcloud compute instances add-labels "$STANDBY_VM" --zone="${{ env.ZONE }}" --labels=role=active
          gcloud compute instances add-labels "$ACTIVE_VM" --zone="${{ env.ZONE }}" --labels=role=standby
