plugins {
    id 'java'
    // 컴파일 전 Java 코드 스타일과 기본 문법 규칙을 검사한다.lukas(이대훈)
    id 'checkstyle'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ktb4.team16'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Security: URL 인가, CSRF 방어 및 BCrypt 비밀번호 해싱
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JWT 발급·검증
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    // REST API
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Spring Boot 4 auto-configuration for Sentry error monitoring.
    implementation 'io.sentry:sentry-spring-boot-4-starter:8.58.0'
    // Docker healthcheck에 사용할 /actuator/health endpoint 제공
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Prometheus가 수집할 지표를 Actuator 형식으로 제공하는 런타임 레지스트리
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // Swagger/OpenAPI 문서 및 Swagger UI 제공을 위한 의존성
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // 사진 임시 업로드를 위해 Google Cloud Storage 연동에 필요한 의존성
    implementation platform('com.google.cloud:libraries-bom:26.86.0')
    implementation 'com.google.cloud:google-cloud-storage'

    // Persistence / MySQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 명시적으로 켠 인기곡 캐시 프로필에서만 연결하며 Redis 자동 health 구성을 추가하지 않는다.
    implementation 'io.lettuce:lettuce-core'
    // 기존 서비스 트랜잭션 바깥에서 선택적으로 집계 결과를 재사용한다.
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'

    // Bean Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database migration
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
    toolVersion = '0.8.13'   // JDK 21을 지원하는 버전
}

// 측정에서 제외할 대상 
ext.coverageExcludes = [
    '**/*Application.class',
    '**/config/**',
    '**/dto/**',
    '**/*Request.class',
    '**/*Response.class'
]

def runningOnGitHubActions = System.getenv('GITHUB_ACTIONS')?.equalsIgnoreCase('true')
def localTestDatabaseUrl = 'jdbc:mysql://127.0.0.1:3313/mulo_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul'
def localWeatherTestDatabaseUrl = 'jdbc:mysql://127.0.0.1:3314/mulo_weather_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul'
def groupTestHostPort = 3318
def groupTestContainerName = 'mulo-be-group-test-mysql'
def groupTestVolumeName = 'mulo-be-group-test-data'
def groupTestNetworkName = 'mulo-be-group-test-network'
def groupTestDatabaseUrl = System.getenv('MULO_BE_GROUP_TEST_DB_URL') ?: ''
def groupTestDatabaseUsername = System.getenv('MULO_BE_GROUP_TEST_DB_USERNAME') ?: ''
def groupTestDatabasePassword = System.getenv('MULO_BE_GROUP_TEST_DB_PASSWORD') ?: ''
def groupTestOptIn = project.findProperty('muloBeGroupTestMysql')?.toString()
if (groupTestOptIn != null && !(groupTestOptIn in ['true', 'false'])) {
    throw new GradleException('Use -PmuloBeGroupTestMysql=true to select the isolated group-test MySQL path.')
}
def useGroupTestMysql = groupTestOptIn == 'true'
def localTestJvmEnvironment = [
    DB_URL: localTestDatabaseUrl,
    DB_USERNAME: 'mulo_test',
    DB_PASSWORD: 'mulo_test_only_password',
    SPRING_DATASOURCE_URL: localTestDatabaseUrl,
    SPRING_DATASOURCE_USERNAME: 'mulo_test',
    SPRING_DATASOURCE_PASSWORD: 'mulo_test_only_password',
    SPRING_PROFILES_ACTIVE: 'test',
    JWT_SECRET: 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=',
    GCP_PROJECT_ID: 'mulo-local-test',
    GCS_BUCKET_NAME: 'mulo-local-test',
    KAKAO_REST_API_KEY: 'local-test-only',
    KMA_SERVICE_KEY: 'local-test-only',
    SPOTIFY_CLIENT_ID: 'local-test-only',
    SPOTIFY_CLIENT_SECRET: 'local-test-only',
    AI_INTERNAL_TOKEN: 'local-test-only',
    AI_MOCK_ENABLED: 'true'
]

def groupTestJvmEnvironment = new LinkedHashMap(localTestJvmEnvironment)
groupTestJvmEnvironment.putAll([
    DB_URL: groupTestDatabaseUrl,
    DB_USERNAME: groupTestDatabaseUsername,
    DB_PASSWORD: groupTestDatabasePassword,
    SPRING_DATASOURCE_URL: groupTestDatabaseUrl,
    SPRING_DATASOURCE_USERNAME: groupTestDatabaseUsername,
    SPRING_DATASOURCE_PASSWORD: groupTestDatabasePassword
])

def runReadOnlyDockerCommand = { List<String> command, String description ->
    def process = new ProcessBuilder(command).redirectErrorStream(true).start()
    def output = process.inputStream.getText('UTF-8').trim()
    if (process.waitFor() != 0) {
        throw new GradleException("Unable to verify isolated group-test MySQL $description.")
    }
    output
}

def verifyGroupTestMysql = {
    if (runningOnGitHubActions) {
        throw new GradleException('The local group-test MySQL path cannot be selected in GitHub Actions.')
    }
    if (!(groupTestDatabaseUrl ==~ /(?i)jdbc:mysql:\/\/127\.0\.0\.1:${groupTestHostPort}\/mulo_test(?:\?.*)?/)) {
        throw new GradleException('MULO_BE_GROUP_TEST_DB_URL must target the isolated mulo_test database on 127.0.0.1:3318.')
    }
    if (groupTestDatabaseUsername != 'mulo_test'
            || groupTestDatabasePassword.length() < 32
            || groupTestDatabasePassword == 'mulo_test_only_password') {
        throw new GradleException('Set a random test-only password and the mulo_test account for the isolated group-test database.')
    }

    def contextName = runReadOnlyDockerCommand(['docker', 'context', 'show'], 'Docker context')
    def contextEndpoint = runReadOnlyDockerCommand([
        'docker', 'context', 'inspect', '--format', '{{.Endpoints.docker.Host}}', contextName
    ], 'Docker context endpoint')
    def engineIdentity = runReadOnlyDockerCommand(['docker', 'info', '--format', '{{.Name}}|{{.OSType}}'], 'Docker engine')
    if (contextName != 'desktop-linux'
            || !contextEndpoint.startsWith('unix://')
            || !contextEndpoint.endsWith('/.docker/run/docker.sock')
            || engineIdentity != 'docker-desktop|linux') {
        throw new GradleException('The isolated group-test database requires the local Mac Docker Desktop engine.')
    }

    def inspectTemplate = [
        '{{.Name}}|{{.Config.Image}}|{{(index (index .NetworkSettings.Ports "3306/tcp") 0).HostIp}}',
        '|{{(index (index .NetworkSettings.Ports "3306/tcp") 0).HostPort}}',
        '|{{range .Mounts}}{{if eq .Destination "/var/lib/mysql"}}{{.Name}}{{end}}{{end}}',
        '|{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}',
        '|{{range $name, $network := .NetworkSettings.Networks}}{{$name}}{{end}}'
    ].join('')
    def container = runReadOnlyDockerCommand([
        'docker', 'inspect', '--format', inspectTemplate, groupTestContainerName
    ], 'container metadata')
    def fields = container.split('\\|', -1)
    if (fields.length != 8
            || fields[0] != "/$groupTestContainerName"
            || fields[1] != 'mysql:8.4'
            || fields[2] != '127.0.0.1'
            || fields[3] != groupTestHostPort.toString()
            || fields[4] != groupTestVolumeName
            || fields[5] != 'running'
            || fields[6] != 'healthy'
            || fields[7] != groupTestNetworkName) {
        throw new GradleException('Refusing to run tests: the isolated group-test MySQL container, port, volume, network, or health status does not match.')
    }

    def network = runReadOnlyDockerCommand([
        'docker', 'network', 'inspect', '--format', '{{.Name}}|{{.Driver}}', groupTestNetworkName
    ], 'dedicated network')
    if (network != "$groupTestNetworkName|bridge") {
        throw new GradleException('The isolated group-test MySQL network must be the dedicated bridge network.')
    }

    def identity = runReadOnlyDockerCommand([
        'docker', 'exec', groupTestContainerName, 'sh', '-c',
        'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=socket --batch --skip-column-names '
                + '--user="$MYSQL_USER" --database="$MYSQL_DATABASE" '
                + '-e "SELECT VERSION(), DATABASE(), CURRENT_USER()"'
    ], 'database identity')
    def identityFields = identity.split('\\t', -1)
    if (identityFields.length != 3
            || !(identityFields[0] ==~ /^8\.4(?:\.\d+)?(?:[-+].*)?$/)
            || identityFields[1] != 'mulo_test'
            || !identityFields[2].startsWith('mulo_test@')) {
        throw new GradleException('The isolated group-test database must report MySQL 8.4, schema mulo_test, and the mulo_test account.')
    }

    def containerPasswordHash = runReadOnlyDockerCommand([
        'docker', 'exec', groupTestContainerName, 'sh', '-c',
        'printf %s "$MYSQL_PASSWORD" | sha256sum | cut -d" " -f1'
    ], 'test account credential')
    def configuredPasswordHash = java.security.MessageDigest.getInstance('SHA-256')
            .digest(groupTestDatabasePassword.getBytes('UTF-8')).encodeHex().toString()
    if (containerPasswordHash != configuredPasswordHash) {
        throw new GradleException('The Gradle test password does not match the isolated container test account.')
    }

    def grants = runReadOnlyDockerCommand([
        'docker', 'exec', groupTestContainerName, 'sh', '-c',
        'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=socket --batch --skip-column-names '
                + '--user="$MYSQL_USER" --database="$MYSQL_DATABASE" -e "SHOW GRANTS FOR CURRENT_USER()"'
    ], 'test account grants').readLines()
    def normalizedGrants = grants.collect { grant -> grant.replace('\\', '') }
    def hasDatabaseGrant = normalizedGrants.any { it.contains(' ON `mulo_test`.*') }
    def grantsAreTestOnly = normalizedGrants.every { grant ->
        grant.contains('GRANT USAGE ON *.*') || grant.contains(' ON `mulo_test`.*')
    } && normalizedGrants.every { grant -> !grant.contains('WITH GRANT OPTION') }
    if (!hasDatabaseGrant || !grantsAreTestOnly) {
        throw new GradleException('The isolated test account must be restricted to the mulo_test database.')
    }
}

def waitForIsolatedMysql = { String containerName, int hostPort, String volumeName, String composeCommand ->
    def deadline = System.currentTimeMillis() + 60000
    def inspectTemplate = '{{.Config.Image}}|{{(index (index .NetworkSettings.Ports "3306/tcp") 0).HostIp}}|{{(index (index .NetworkSettings.Ports "3306/tcp") 0).HostPort}}|{{range .Mounts}}{{if eq .Destination "/var/lib/mysql"}}{{.Name}}{{end}}{{end}}|{{.State.Status}}|{{.State.Health.Status}}'

    while (true) {
        def process = new ProcessBuilder('docker', 'inspect', '--format', inspectTemplate, containerName)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8').trim()
        if (process.waitFor() != 0) {
            throw new GradleException("Isolated MySQL '$containerName' is not running. Start it with: $composeCommand")
        }

        def values = output.split('\\|', -1)
        if (values.length != 6
                || values[0] != 'mysql:8.4'
                || values[1] != '127.0.0.1'
                || values[2] != hostPort.toString()
                || values[3] != volumeName
                || values[4] != 'running') {
            throw new GradleException("Refusing to run tests: '$containerName' does not match the isolated MySQL 8.4 port and volume configuration.")
        }
        if (values[5] == 'healthy') {
            return
        }
        if (values[5] != 'starting' || System.currentTimeMillis() >= deadline) {
            throw new GradleException("Isolated MySQL '$containerName' did not become healthy. Check it with: $composeCommand")
        }
        Thread.sleep(500)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/RecordCreateConcurrencyMysqlIntegrationTest.class'
    if (!runningOnGitHubActions) {
        if (useGroupTestMysql) {
            environment(groupTestJvmEnvironment)
            doFirst {
                verifyGroupTestMysql()
            }
        } else {
            environment(localTestJvmEnvironment)
            doFirst {
                if (!(localTestDatabaseUrl ==~ /(?i)jdbc:mysql:\/\/127\.0\.0\.1:3313\/mulo_test(?:\?.*)?/)) {
                    throw new GradleException('Refusing to run tests: local DB_URL is not the isolated mulo_test database.')
                }
                waitForIsolatedMysql('mulo-general-test-mysql', 3313, 'mulo-general-test-data',
                        'docker compose -f compose.test.yml up -d')
            }
        }
    } else {
        doFirst {
            def databaseUrl = System.getenv('DB_URL')
            if (!(databaseUrl ==~ /(?i)jdbc:mysql:\/\/127\.0\.0\.1:3307\/(mulo|mulo_friend_deadlock_it)(?:\?.*)?/)) {
                throw new GradleException('CI DB_URL must target the workflow MySQL service on 127.0.0.1:3307; refusing to run tests.')
            }
        }
    }
    finalizedBy jacocoTestReport
}

tasks.register('recordCreateConcurrencyTest', Test) {
    description = 'Runs record creation concurrency tests against the isolated Weather integration database.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/RecordCreateConcurrencyMysqlIntegrationTest.class'
    useJUnitPlatform()
    def weatherTestJvmEnvironment = new LinkedHashMap(localTestJvmEnvironment)
    weatherTestJvmEnvironment.putAll([
        DB_URL: localWeatherTestDatabaseUrl,
        DB_USERNAME: 'mulo_weather_it',
        DB_PASSWORD: 'mulo_weather_it_test_only',
        SPRING_DATASOURCE_URL: localWeatherTestDatabaseUrl,
        SPRING_DATASOURCE_USERNAME: 'mulo_weather_it',
        SPRING_DATASOURCE_PASSWORD: 'mulo_weather_it_test_only',
        SPRING_PROFILES_ACTIVE: 'weather-it',
        MULO_WEATHER_IT_DB_URL: localWeatherTestDatabaseUrl,
        MULO_WEATHER_IT_DB_USERNAME: 'mulo_weather_it',
        MULO_WEATHER_IT_DB_PASSWORD: 'mulo_weather_it_test_only'
    ])
    environment(weatherTestJvmEnvironment)
    doFirst {
        waitForIsolatedMysql('mulo-weather-concurrency-test-mysql', 3314,
                'mulo-weather-concurrency-test-data',
                'docker compose -f compose.weather-it.yml up -d')
    }
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: coverageExcludes)
    }))
}

jacocoTestCoverageVerification {
    dependsOn tasks.named('test')
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: coverageExcludes)
    }))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestCompileOnly.extendsFrom testCompileOnly
    integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against a disposable MySQL database.'
    group = 'verification'
    dependsOn tasks.named('integrationTestClasses')
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}
