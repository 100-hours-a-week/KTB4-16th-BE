name: mulo-be-group-chat-test

services:
  mysql:
    image: mysql:8.4
    container_name: mulo-be-group-test-mysql
    environment:
      MYSQL_DATABASE: mulo_test
      MYSQL_USER: mulo_test
      MYSQL_PASSWORD: ${MULO_BE_GROUP_TEST_DB_PASSWORD:?Set a random test-only DB password}
      MYSQL_ROOT_PASSWORD: ${MULO_BE_GROUP_TEST_ROOT_PASSWORD:?Set a random test-only root password}
    ports:
      - "127.0.0.1:3318:3306"
    volumes:
      - group-test-data:/var/lib/mysql
    networks:
      - group-test-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  group-test-data:
    name: mulo-be-group-test-data

networks:
  group-test-network:
    name: mulo-be-group-test-network
    driver: bridge
